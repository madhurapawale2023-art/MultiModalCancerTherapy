<!DOCTYPE html>
<html lang="en" ng-app="MultiModalCancerTherapy">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        MultiModalCancerTherapy | Clinical Decision Support
    </title>

    <!-- =========================================================
         Bootstrap 5
    ========================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- =========================================================
         Bootstrap Icons
    ========================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <!-- =========================================================
         Application CSS
    ========================================================== -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <!-- =========================================================
         Angular Application Shell
    ========================================================== -->

    <div
        id="app"
        class="mmct-app"
    >

        <!-- =====================================================
             Main View
             Route-specific controllers are loaded here
        ====================================================== -->

        <main
            id="main-content"
            class="mmct-main"
            ng-view>
        </main>

    </div>

    <!-- =========================================================
         Global Loading Overlay
    ========================================================== -->

    <div
        class="mmct-loading-overlay"
        ng-if="pageLoading">

        <div class="text-center">

            <div
                class="spinner-border"
                role="status">
            </div>

            <div class="mt-3">
                Loading...
            </div>

        </div>

    </div>

    <!-- =========================================================
         Global Toast
    ========================================================== -->

    <div
        id="mmct-toast"
        class="toast-container position-fixed top-0 end-0 p-3"
        aria-live="polite"
        aria-atomic="true">
    </div>

    <!-- =========================================================
         Footer Status
    ========================================================== -->

    <div class="mmct-system-status">

        <span>
            <i class="bi bi-shield-check me-1"></i>
            Clinical Decision Support
        </span>

        <span class="mmct-status-separator">|</span>

        <span>
            Senior Doctor Final Authority
        </span>

    </div>

    <!-- =========================================================
         AngularJS
    ========================================================== -->

    <script
        src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js">
    </script>

    <!-- =========================================================
         AngularJS Route
    ========================================================== -->

    <script
        src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular-route.min.js">
    </script>

    <!-- =========================================================
         Bootstrap JS
    ========================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- =========================================================
         Chart.js
    ========================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js">
    </script>

    <!-- =========================================================
         Application Core
    ========================================================== -->

    <script src="js/app.module.js"></script>
    <script src="js/app.routes.js"></script>
    <script src="js/app.config.js"></script>

    <!-- =========================================================
         Services
    ========================================================== -->

    <script src="js/services/ApiService.js"></script>
    <script src="js/services/AuthService.js"></script>

    <!-- =========================================================
         Controllers
    ========================================================== -->

    <script src="js/controllers/LoginController.js"></script>
    <script src="js/controllers/DashboardController.js"></script>
    <script src="js/controllers/PatientController.js"></script>
    <script src="js/controllers/PatientDetailController.js"></script>
    <script src="js/controllers/AIController.js"></script>
    <script src="js/controllers/ReportController.js"></script>
    <script src="js/controllers/SpecialistController.js"></script>
    <script src="js/controllers/WorkflowController.js"></script>
    <script src="js/controllers/AuditController.js"></script>

</body>

</html>
